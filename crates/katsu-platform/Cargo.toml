[package]
name = "katsu-platform"
description = "Operating system specifics for the katsu runtime: executable memory, W^X, mmap and signals. Internal, no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
memmap2.workspace = true
thiserror.workspace = true

# The virtual memory calls are the only place the operating systems disagree, and they disagree
# enough that a portability shim over them would be a lie. Each backend gets its own crate and
# neither is compiled on the other platform. See src/sys/mod.rs.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
