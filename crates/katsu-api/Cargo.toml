[package]
name = "katsu-api"
description = "The embedding API for the katsu runtime. This is the stable public surface for embedders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
katsu-builtins.workspace = true
katsu-jit = { workspace = true, optional = true }
katsu-loop.workspace = true
katsu-vm.workspace = true
thiserror.workspace = true

[features]
default = ["jit"]
jit = ["dep:katsu-jit"]
full-intl = ["katsu-builtins/full-intl"]
uring = ["katsu-loop/uring"]
