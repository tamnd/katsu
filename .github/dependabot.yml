version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One pull request per family rather than one per crate. oxc in particular releases
      # roughly weekly across a dozen crates that have to move together.
      oxc:
        patterns: ["oxc*"]
      tracing:
        patterns: ["tracing*"]
      # These three move as a set. syn 3 arrived on its own and needed proc-macro2 and quote
      # alongside it, so grouping them saves doing that reconciliation by hand next time.
      proc-macro:
        patterns: ["syn", "quote", "proc-macro2"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
