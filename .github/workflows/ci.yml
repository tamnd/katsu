name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  layers:
    name: Layer stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # The dependency direction in spec/03-architecture.md is a rule rather than a
      # suggestion, so it is a failing build rather than a paragraph nobody reads.
      - run: cargo run -p xtask -- layers

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-latest
          - name: linux aarch64
            os: ubuntu-24.04-arm
          - name: macos aarch64
            os: macos-latest
          - name: windows x86-64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace --all-features
      - run: cargo build --release
      # Through cargo rather than by path, because the file is katsu on two of these
      # platforms and katsu.exe on the third and there is no reason to care which.
      - run: cargo run --release -p katsu -- --build-info

  features:
    name: Feature set ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The four configurations in spec/16-package-layout.md are real products rather than
      # theoretical combinations, and a feature flag that is not in CI is a feature flag
      # that is already broken.
      matrix:
        include:
          - name: full
            args: -p katsu
          - name: embedded
            args: -p katsu-runtime --no-default-features --features jit,minimal
          - name: jitless
            args: -p katsu --no-default-features --features node
          - name: minimal jitless
            args: -p katsu-runtime --no-default-features --features minimal
          - name: io_uring
            args: -p katsu-runtime --features uring
          - name: native addons
            args: -p katsu --features addons
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo check ${{ matrix.args }} --all-targets

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo doc --workspace --no-deps --all-features

  # The conformance ratchet from spec/14-quality-bar.md. It is here rather than on a nightly
  # because the thing it is guarding against is a commit that quietly stops running tests, and a
  # nightly finds that a day after the commit that caused it has been merged and forgotten.
  conformance:
    name: test262
    runs-on: ubuntu-latest
    env:
      # Pinned, because the expectations file is a set of names taken out of the suite and the suite
      # gains and renames tests every week. An unpinned clone would make CI fail on somebody else's
      # commit. Moving this is its own pull request, with the re-blessed file in the same diff.
      SUITE: ac7b5f8c39c27b55176c20ead2a69b1402d0d1d3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/cache@v4.3.0
        id: suite
        with:
          path: vendor/test262
          key: test262-${{ env.SUITE }}
      - name: Fetch the suite at the pinned revision
        if: steps.suite.outputs.cache-hit != 'true'
        run: |
          git init vendor/test262
          git -C vendor/test262 remote add origin https://github.com/tc39/test262
          git -C vendor/test262 fetch --depth 1 origin "$SUITE"
          git -C vendor/test262 checkout "$SUITE"
      - run: cargo run --release -p test262-runner

  # Katsu against node on generated programs. Separate from the conformance job because it answers a
  # different question: test262 asks whether we follow the standard, and this asks whether we behave
  # like the implementation everybody's code was actually written against, which is what the
  # compatibility goal in the README means in practice.
  #
  # The count is small enough to finish in a couple of minutes on a shared runner and the seed is
  # fixed, so a red run here is a red run everybody else can reproduce with one command rather than
  # a flake somebody reruns until it passes. Finding new things is what a longer run on real
  # hardware is for.
  differential:
    name: Differential against node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
      - run: cargo run --release -p differential -- --count 2000 --seed 0

  # A publish cannot be taken back, so everything about it that can be checked without a tag is
  # checked on every commit. The failure this is really guarding against is a crate that only
  # builds because the crate it depends on is a directory next to it, which is invisible in a
  # workspace build and breaks for the first person who runs `cargo add katsu-runtime`.
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo run -p xtask -- release
      - name: Ask crates.io whether this version is already published
        id: published
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "katsu") | .version')
          if curl -sfo /dev/null -A "katsu ci" "https://crates.io/api/v1/crates/katsu/$version"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Skipped between a release and the version bump that follows it, because cargo cannot
      # package a version that is already on the registry. The check above is what decides,
      # rather than a rule about which branch this is.
      - name: Package every crate as crates.io would
        if: steps.published.outputs.exists != 'true'
        run: cargo publish --workspace --dry-run --locked

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Distribution size is one of the four axes where the 10x claim actually holds, so it is
  # measured on every commit rather than at release time when it is too late to react.
  size:
    name: Distribution size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo build --release -p katsu
      - name: Report binary size against the budget
        run: |
          bytes=$(stat -c %s target/release/katsu)
          budget=$((15 * 1000 * 1000))
          echo "katsu binary: $bytes bytes, budget $budget bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$budget" ]; then
            echo "over the 15 MB budget in spec/02-the-10x-goal.md"
            exit 1
          fi
