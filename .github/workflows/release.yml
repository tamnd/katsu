name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The tier 1 platforms from spec/14-quality-bar.md. Linux, macOS and Windows, on
      # both architectures where both exist, at parity.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Cross compiled from the arm64 runner rather than built on an Intel one. GitHub
          # retired the macos-13 image on 4 December 2025, and the only remaining x86_64 macOS
          # image, macos-15-intel, is announced as going away in autumn 2027 with no
          # replacement. A release job does not run tests, so building this target on Apple
          # silicon costs nothing and does not have to be revisited on somebody else's schedule.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p katsu
      # Two packaging steps rather than one, because a tarball is what a Unix user expects
      # to download and a zip is what a Windows user expects, and faking either one is a
      # worse experience than writing the six lines twice.
      - name: Package
        if: runner.os != 'Windows'
        run: |
          name=katsu-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/katsu "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "katsu-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/katsu.exe" "dist/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii -Path "dist/$name.zip.sha256" -Value "$hash  $name.zip"
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*.${{ matrix.archive }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}*

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
          generate_release_notes: true

  # The crates are a release artifact like the binaries are, listed as one in
  # spec/16-package-layout.md, because `cargo add katsu-runtime` is how anybody embeds this in a
  # Rust program. They go up after the binaries have built on every tier 1 platform, since a
  # version on crates.io can be yanked but never replaced and a build failure is a much better
  # place to find out than a yank is.
  crates:
    name: crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The token is a secret on this environment rather than on the repository, and the
    # environment takes deployments only from a tag matching v*, so nothing running on a branch
    # or on a pull request can reach it even by asking for it by name.
    environment: crates-io
    permissions:
      contents: read
    # Shared with the manual publish in crates.yml, so a release and somebody finishing an older
    # one cannot spend the same rate limit allowance on each other's refusals.
    concurrency:
      group: crates-io
    # A first release of a workspace this size is mostly waiting. crates.io lets an account create
    # a burst of five crate names and then one every ten minutes, so fifteen new names take a little
    # over two hours of sitting still. Once the names exist the limit is the one for new versions,
    # which is a burst of thirty, and this job takes minutes again.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # One command for fifteen crates. It runs the release check first, so a tag that does not
      # match the version in the tree stops here rather than publishing the previous version under
      # the new name, then uploads in dependency order, skips anything already on crates.io and
      # keeps to the pace the registry allows rather than asking early and being refused. Skipping
      # is what makes a stopped run resumable by re-running the job, which cargo cannot do on its
      # own.
      # The tag arrives through the environment rather than pasted into the command, because a
      # ref name is text somebody chose and text somebody chose does not belong in a shell line.
      - name: Publish
        run: cargo run -p xtask -- publish --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}
          # Replaced by trusted publishing once these crates exist on crates.io. That is the
          # better mechanism, because it swaps a long lived secret for a token minted for one
          # run, and it cannot be set up for a crate that has never been published. See issue
          # #78.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
