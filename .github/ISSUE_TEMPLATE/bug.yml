name: Bug report
description: Something behaves differently from the specification or from Node.js.
labels: ["kind: bug"]
body:
  - type: markdown
    attributes:
      value: |
        katsu is pre M0 and does not execute JavaScript yet, so a report that it cannot run your program is expected rather than a bug. Bugs in the tooling, the build, or a documented behaviour are worth filing.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what came out.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: If this is a difference from Node.js, say which Node.js version you compared against.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest program that shows it, and the exact command.
      render: shell
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Output of `katsu --build-info`
      render: shell
    validations:
      required: true
